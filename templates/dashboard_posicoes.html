<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posições</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/consultar.css') }}" />
</head>
<body>
    <h1>Posições</h1>
    <form id="form_posicoes" method="POST" action="{{ url_for('update_posicoes') }}">
        <table>
            <thead>
                <tr>
                    <th>Selecionar</th>
                    <th>Data/Hora</th>
                    <th>Ramal</th>
                    <th>Ferrovia</th>
                    <th>Quantidade</th>
                    <th>Tipo</th>
                    <th>Terminal</th>
                </tr>
            </thead>
            <tbody>
                {% for posicao in posicoes %}
                <tr>
                    <td><input type="checkbox" name="delete_{{ loop.index0 }}"></td>
                    <td><input type="text" name="dataHora_{{ loop.index0 }}" value="{{ posicao.dataHora }}" {% if not editable %}readonly{% endif %}></td>
                    <td><input type="text" name="ramal_{{ loop.index0 }}" value="{{ posicao.ramal }}" {% if not editable %}readonly{% endif %}></td>
                    <td><input type="text" name="ferrovia_{{ loop.index0 }}" value="{{ posicao.ferrovia }}" {% if not editable %}readonly{% endif %}></td>
                    <td><input type="number" name="quantidade_{{ loop.index0 }}" value="{{ posicao.quantidade }}" {% if not editable %}readonly{% endif %}></td>
                    <td><input type="text" name="tipo_{{ loop.index0 }}" value="{{ posicao.tipo }}" {% if not editable %}readonly{% endif %}></td>
                    <td><input type="text" name="terminal_{{ loop.index0 }}" value="{{ posicao.terminal }}" {% if not editable %}readonly{% endif %}></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% if editable %}
            <button type="submit">Salvar</button>
            <button type="submit" formaction="{{ url_for('delete_posicoes') }}">Excluir Selecionados</button>
        {% else %}
            <a href="{{ url_for('edit_posicoes') }}">Editar</a>
        {% endif %}
    </form>
    <a href="{{ url_for('dashboard') }}">Voltar ao Dashboard</a>
</body>
</html>
